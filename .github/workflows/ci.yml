name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts dashboard
      - name: Type check
        run: mypy
      - name: Import check
        run: python -c "import freshguard, freshguard.pipeline, freshguard.inventory.experiment"
      - name: Unit and integration tests (synthetic fixture only, no dataset download)
        run: pytest
