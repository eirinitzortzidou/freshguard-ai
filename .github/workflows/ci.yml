name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  locked:
    # Exact versions of the verified pipeline run (requirements/lock.txt).
    name: tests (Python 3.13, locked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (locked)
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/lock.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts dashboard
      - name: Type check
        run: mypy
      - name: CLI and import check
        run: |
          freshguard --help
          python -m freshguard.verify --help
          python -c "import freshguard, freshguard.pipeline, freshguard.evaluation.nested"
      - name: Config validation
        run: |
          python -c "
          from freshguard.config import load_config
          for c in ('freshretailnet', 'm5', 'synthetic'):
              cfg = load_config(f'configs/{c}.yaml'); assert cfg['seed'] == 2025, c
          "
      - name: Unit and integration tests (synthetic fixture only, no dataset download)
        run: pytest

  compat:
    # Newest versions allowed by pyproject.toml on the minimum supported Python.
    name: tests (Python 3.11, latest allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest
