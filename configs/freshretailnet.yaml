# FreshRetailNet-50K (Dingdong-Inc, CC BY 4.0): primary dataset, hourly stockout flags.
# All headline results use this config. `freshguard data` downloads the Parquet files from
# the Hugging Face Hub, or uses copies placed manually in data/raw/freshretailnet/.
extends: base.yaml
data:
  source: freshretailnet
  raw_dir: data/raw/freshretailnet
  processed_dir: data/processed/freshretailnet
  # SHA-256 of the published Parquet files used for every reported result (verified by
  # `freshguard data`; a mismatch stops the run).
  sha256:
    train: 6706832db892bbae4969c19d87e07975d2543d2ba7d7d4756360654785de5a3d
    eval: 1b118840664280c6b88bffc84c80ee1f54c05d911e354b7599e5da10995e960e
paths:
  metrics: reports/metrics/freshretailnet
  figures: reports/figures/freshretailnet
  models: models/freshretailnet
  artifacts: data/processed/freshretailnet/artifacts
