# Synthetic FreshRetailNet-shaped fixture: CI and smoke tests ONLY, never headline results.
extends: base.yaml
data:
  source: synthetic
  processed_dir: data/processed/synthetic
splits:
  train_start_origin: "2024-04-25"
forecasting:
  horizons: [1, 2]
  lightgbm:
    num_leaves: 15
    min_data_in_leaf: 20
    num_boost_round: 60
    early_stopping_rounds: 10
  tuning:
    enabled: false
nested:
  first_week: "2024-05-22"        # fewer walk-forward refits keep the CI smoke test fast
  folds: ["2024-06-19", "2024-06-26"]
finance:
  bootstrap_samples: 50
paths:
  metrics: reports/metrics/synthetic
  figures: reports/figures/synthetic
  models: models/synthetic
  artifacts: data/processed/synthetic/artifacts
