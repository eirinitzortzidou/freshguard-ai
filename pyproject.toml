[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshguard"
version = "0.1.0"
description = "Demand forecasting and perishable inventory optimization to reduce fresh food waste (offline simulation study)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eirini Tzortzidou" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=14",
    "lightgbm>=4.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[project.scripts]
freshguard = "freshguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: end-to-end smoke tests on synthetic data"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/freshguard"]

[[tool.mypy.overrides]]
# Polars types Series.sum()/mean()/quantile() as a broad scalar union (incl. date, str,
# Decimal), which makes every float(...) of a numeric aggregate an arg-type error.
module = ["freshguard.data.ingest", "freshguard.visualization.eda",
          "freshguard.evaluation.forecast_eval", "freshguard.inventory.experiment"]
disable_error_code = ["arg-type", "operator"]
